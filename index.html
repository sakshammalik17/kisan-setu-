        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();

      // ====================================================================
      // 5. INTENT-BASED HINDI VOICE ASSISTANT
      // ====================================================================
      const executeHindiVoiceIntent = (rawText) => {
        const text = rawText.trim().toLowerCase();
        let intentType = 'ACTION';
        let targetScreen = null;
        let responseSpeech = '';
        let formNoticeText = null;

        // Slot Booking Intent
        if (text.includes('स्लॉट') && (text.includes('बुक') || text.includes('लेना') || text.includes('करना') || text.includes('चाहिए') || text.includes('करो'))) {
          intentType = 'FORM_FILL';
          targetScreen = 'slot_booking';

          let matchedCrop = farmerCrops[0];
          if (text.includes('गेहूं') || text.includes('गेहूँ')) {
            matchedCrop = farmerCrops.find(c => c.name.includes('गेहूँ')) || farmerCrops[0];
          } else if (text.includes('धान')) {
            matchedCrop = farmerCrops.find(c => c.name.includes('धान')) || farmerCrops[0];
          } else if (text.includes('चना')) {
            matchedCrop = farmerCrops.find(c => c.name.includes('चना')) || farmerCrops[0];
          } else if (text.includes('सरसों')) {
            matchedCrop = farmerCrops.find(c => c.name.includes('सरसों')) || farmerCrops[0];
          }

          if (matchedCrop) {
            setSlotBookingCropId(matchedCrop.id);

          formNoticeText = `${matchedCrop.name} हेतु भविष्य-तिथि कैलेंडर खुल गया है। 10 सितम्बर या उसके बाद की तारीख चुनकर 'स्लॉट बुक करें' दबाएं।`;
          responseSpeech = `${matchedCrop.name} के लिए स्लॉट बुकिंग कैलेंडर खोल दिया गया है। नियम अनुसार बुकिंग परसों 10 सितम्बर से उपलब्ध है। कृपया तारीख और समय स्लॉट चुनें।`;
        }

        else if (text.includes('मेरी बारी') || text.includes('बारी कब') || text.includes('बारी बताओ') || text.includes('कतार')) {

          targetScreen = 'queue_view';

        // Crop Status Intent
        else if (text.includes('फसल की स्थिति') || text.includes('स्थिति बताओ') || text.includes('स्थिति दिखाओ')) {
          intentType = 'INFO';
          targetScreen = 'crop_detail';
          responseSpeech = `फसल ${activeCrop.name} का वर्तमान चरण ${activeCrop.currentStage} है।`;
        }
        // Notifications Intent

          intentType = 'ACTION';
          targetScreen = 'notifications';
          responseSpeech = `आपके पास ${unreadNotifCount} नई सूचनाएँ हैं।`;
        }
        // Weighing Complaint Voice Extraction
        else if (text.includes('वजन') || text.includes('तौल') || text.includes('कांटा') || (text.includes('शिकायत') && (text.includes('कम') || text.includes('सही नहीं')))) {
          intentType = 'FORM_FILL';
          targetScreen = 'complaint_new';
          setCompCategory('तौल / वजन की समस्या');
          let msg = rawText.replace(/^(मुझे\s+)?(एक\s+)?शिकायत\s+(है|करनी\s+है)\s*(कि|की|,\s*)?/i, '').trim();
          setCompText(msg || rawText);
          formNoticeText = `तौल समस्या का वर्ग चुना गया। शिकायत बॉक्स में भरा गया: "${msg || rawText}"। सबमिट बटन दबाएँ।`;
          responseSpeech = `तौल समस्या चुनकर आपकी शिकायत लिख दी गई है। भेजने के लिए नीचे 'शिकायत दर्ज करें' बटन दबाएँ।`;

          intentType = 'ACTION';
          targetScreen = 'travel_view';

        }
        // Departure Voice Command
        else if (text.includes('घर से रवाना') || text.includes('रवाना हो गया') || text.includes('निकल गया')) {

          targetScreen = 'travel_view';
          farmerMarkDeparture(activeCrop.id);

          responseSpeech = `ट्रैक्टर समस्या की सूचना दर्ज कर ली गई है। स्लॉट सुरक्षा हेतु नीचे दिया गया बटन दबाएँ।`;

        else if (text.includes('मेरा टोकन') || text.includes('टोकन बताओ')) {

        }
        // Profile
        else if (text.includes('मेरी जानकारी') || text.includes('प्रोफाइल')) {
          intentType = 'INFO';
          targetScreen = 'profile';
          responseSpeech = `किसान ${currentFarmer.name} की जानकारी दिखाई जा रही है।`;
        }
        // Home
        else if (text.includes('होम') || text.includes('मुख्य पृष्ठ') || text.includes('वापस')) {
          intentType = 'ACTION';
          targetScreen = 'home';
          responseSpeech = 'मुख्य पृष्ठ पर आ गए हैं।';
        }
        else {
          intentType = 'ERROR';
          responseSpeech = `मैं '${rawText}' समझ नहीं पाया। आप बोल सकते हैं: 'स्लॉट बुक करना है', 'मेरी बारी बताओ', या 'मुझे शिकायत है'`;
        }

        if (targetScreen) setScreen(targetScreen);

        setVoiceFeedback({
          spokenText: rawText,
          systemResponse: responseSpeech,
          formNotice: formNoticeText
        });

        speakHindi(responseSpeech);
      };

      const toggleVoiceRecognition = () => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          setMicErrorMsg('ब्राउज़र में वॉयस रिकग्निशन समर्थित नहीं है। नीचे दिए गए बोलचाल बटनों पर टैप करें।');
          return;
        }

        if (isListening) {
          setIsListening(false);
          return;
        }

        try {
          const rec = new SpeechRec();
          rec.lang = 'hi-IN';
          rec.continuous = false;
          rec.interimResults = false;

          rec.onstart = () => {
            setIsListening(true);
            setMicErrorMsg(null);
            playChime();
            setVoiceFeedback({
              spokenText: '',
              systemResponse: 'मैं सुन रहा हूँ... कृपया बोलें...',
              formNotice: null
            });
          };

          rec.onresult = (e) => {
            const transcript = e.results[0][0].transcript;
            setIsListening(false);
            executeHindiVoiceIntent(transcript);
          };

          rec.onerror = (e) => {
            setIsListening(false);
            if (e.error === 'not-allowed') {
              setMicErrorMsg('माइक्रोफ़ोन की अनुमति नहीं मिली। नीचे दिए गए एक्शन चिप्स पर टच करके टेस्ट करें।');
            } else {
              setVoiceFeedback({
                spokenText: '',
                systemResponse: 'आवाज़ साफ़ नहीं आई। कृपया दोबारा बोलें।',
                formNotice: null
              });
            }
          };

          rec.onend = () => setIsListening(false);
          rec.start();
        } catch (e) {
          setIsListening(false);
          setMicErrorMsg('माइक्रोफ़ोन चालू करने में त्रुटि। नीचे दिए गए बटनों से टेस्ट करें।');
        }
      };

      // ====================================================================
      // 6. ADMIN ACTIONS & STAGE CONTROLLERS (TRIGGERING REAL NOTIFICATIONS)
      // ====================================================================
      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminIdInput.trim() === 'admin001' && adminPasswordInput === 'Kisan@123') {
          setAdminSession({ isLoggedIn: true, adminId: 'admin001' });
          setAdminLoginError('');
          setRoleMode('admin');
          setAdminActiveTab('overview');
          speakHindi('अधिकारी कंसोल में आपका स्वागत है।');

          setAdminLoginError('अमान्य आईडी या पासवर्ड! कृपया डेमो क्रेडेंशियल्स का उपयोग करें।');
        }
      };

      // Admin Updates Procurement Stage for a Crop
      const adminUpdateCropStage = (cropId, targetStageId) => {
        const crop = db.crops.find(c => c.id === cropId);
        if (!crop) return;

        const stageObj = JOURNEY_STAGES.find(s => s.id === targetStageId);

        let notifTitle = '';
        let notifIcon = stageObj.icon;

        if (targetStageId === 4) {
          statusMsg = 'मंडी गेट पर वाहन प्रवेश अधिकृत किया गया।';
          notifTitle = '📍 मंडी में प्रवेश प्रमाणित';
        } else if (targetStageId === 5) {
          statusMsg = 'धर्मकांटा शेड की कतार में प्रतीक्षा दर्ज।';
          notifTitle = '⏳ लाइन में प्रतीक्षा प्रारंभ';

          statusMsg = 'धर्मकांटा क्रमांक 1 पर वाहन बुलाया गया - तौल जारी।';

          notifTitle = '📦 अनलोडिंग प्रक्रियाधीन';
        } else if (targetStageId === 8) {
          statusMsg = 'बोरी गणना व भंडारण पूर्ण - अनलोडिंग सफल।';
          notifTitle = '✅ अनलोडिंग सफल';
        } else if (targetStageId === 9) {
          statusMsg = 'उपार्जन रसीद प्रमाणित एवं खरीद पूर्ण।';
          notifTitle = '📋 उपार्जन सफलतापूर्वक संपन्न';
        }

        const updatedCrops = db.crops.map(c => {
          if (c.id === cropId) {
            return {
              ...c,
              currentStage: targetStageId,
              queuePosition: targetStageId === 6 ? 'धर्मकांटा पर तौल जारी' : targetStageId >= 8 ? 'प्रक्रिया संपन्न' : c.queuePosition
            };
          }
          return c;
        });

        setDb(prev => ({
          ...prev,
          crops: updatedCrops
        }));

        pushFarmerNotification(crop.farmerId, notifTitle, `${statusMsg} (फसल: ${crop.name}, टोकन #${crop.tokenNumber})`, notifIcon, 'crop_detail', 'journey');
        alert(`सफल! किसान की फसल ${crop.name} का चरण अपडेट किया गया: ${stageObj.title}`);
      };

      // Admin Enters Actual Weight & Rate
      const adminRecordWeightAndRate = (cropId, weightInput, rateInput) => {
        const wtNum = parseFloat(weightInput) || 0;
        const rateNum = parseFloat(rateInput) || 2400;
        const totalVal = Math.round(wtNum * rateNum);
        const crop = db.crops.find(c => c.id === cropId);
        if (!crop) return;

        const updatedCrops = db.crops.map(c => {
          if (c.id === cropId) {
            return {
              ...c,
              actualWeightNumeric: wtNum,
              actualWeight: `${wtNum.toFixed(2)} क्विंटल`,
              rateNumeric: rateNum,
              ratePerQuintal: `₹${rateNum.toLocaleString('hi-IN')} / क्विंटल`,
              totalValue: `₹${totalVal.toLocaleString('hi-IN')}`,
              currentStage: Math.max(c.currentStage, 6),
              paymentStatus: 'भुगतान प्रक्रियाधीन (तौल पूर्ण)'
            };
          }
          return c;
        });

        setDb(prev => ({
          ...prev,
          crops: updatedCrops
        }));

        pushFarmerNotification(
          crop.farmerId,
          '⚖️ तौल एवं मूल्य प्रमाणित',
          `आपकी फसल ${crop.name} का शुद्ध वजन ${wtNum.toFixed(2)} क्विंटल एवं MSP मूल्य ₹${totalVal.toLocaleString('hi-IN')} दर्ज किया गया है।`,
          '⚖️',
          'crop_detail',
          'weighing'
        );

        alert(`तौल एवं मूल्य सुरक्षित! शुद्ध वजन: ${wtNum} Q, कुल राशि: ₹${totalVal.toLocaleString('hi-IN')}`);
      };

      // Admin Updates Payment Status
      const adminUpdatePaymentStatus = (cropId, newPaymentStatus) => {
        const crop = db.crops.find(c => c.id === cropId);
        if (!crop) return;

        const updatedCrops = db.crops.map(c => {
          if (c.id === cropId) {
            return {
              ...c,
              paymentStatus: newPaymentStatus,
              currentStage: newPaymentStatus.includes('संपन्न') || newPaymentStatus.includes('Released') ? 10 : c.currentStage
            };
          }
          return c;
        });

        setDb(prev => ({
          ...prev,
          crops: updatedCrops
        }));

        const isDone = newPaymentStatus.includes('संपन्न') || newPaymentStatus.includes('Completed');
        pushFarmerNotification(
          crop.farmerId,
          isDone ? '💰 भुगतान पूर्ण (DBT Released)' : '💰 भुगतान स्थिति अद्यतन',
          `आपकी फसल ${crop.name} हेतु ${newPaymentStatus}। राशि: ${crop.totalValue} DBT द्वारा आपके बैंक खाते में भेजी जा रही है।`,
          '💰',
          'crop_detail',
          'payment'
        );

        alert(`भुगतान स्थिति अपडेट: ${newPaymentStatus}`);
      };

      // Admin Replies to Complaint
      const adminReplyComplaint = (compId, replyText) => {
        if (!replyText.trim()) return;
        const comp = db.complaints.find(c => c.id === compId);
        if (!comp) return;

        const updatedComplaints = db.complaints.map(c => {
          if (c.id === compId) {
            return {
              ...c,
              status: 'समाधान किया गया (Resolved)',
              officerReply: replyText.trim()
            };
          }
          return c;
        });

        setDb(prev => ({
          ...prev,
          complaints: updatedComplaints
        }));

        pushFarmerNotification(
          comp.farmerId,
          '🗣️ शिकायत का उत्तर प्राप्त',
          `आपकी शिकायत "${comp.category}" पर मंडी अधिकारी ने उत्तर दिया: "${replyText.trim()}"`,
          '🗣️',
          'complaints_list',
          'complaint'
        );

        alert('उत्तर किसान को भेज दिया गया और शिकायत का समाधान दर्ज हुआ!');
      };

      // Admin Approves / Rejects Delay Request
      const adminHandleDelayDecision = (delayId, isApproved, revisedTime = 'दोपहर 01:30 बजे') => {
        const req = db.delayRequests.find(d => d.id === delayId);
        if (!req) return;

        const updatedDelays = db.delayRequests.map(d => {
          if (d.id === delayId) {
            return {
              ...d,
              status: isApproved ? '🟢 स्वीकृत व स्लॉट सुरक्षित (Approved)' : '🔴 अनुरोध अस्वीकृत (Rejected)',
              statusCode: isApproved ? 'approved' : 'rejected',
              revisedSlot: isApproved ? revisedTime : null
            };
          }
          return d;

        // Also update crop's reporting time if approved
        const updatedCrops = db.crops.map(c => {
          if (c.tokenNumber === req.tokenNumber && isApproved) {
            return {
              ...c,
              reportingTime: `${revisedTime} (पुनर्निर्धारित)`

                        className="btn-tactile w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-4 rounded-2xl text-base sm:text-lg"
                      >
                        कार्यालय को सूचना भेजें ➔
                      </button>
                    </form>
                  </div>
                )}

                {/* -------------------------------------------------------- */}
                {/* 11. "शिकायत / सवाल" (COMPLAINT SUBMISSION)               */}
                {/* -------------------------------------------------------- */}
                {screen === 'complaint_new' && (
                  <div className="space-y-6 max-w-3xl mx-auto">
                    <div className="flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                      <button onClick={() => setScreen('home')} className="p-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-800 font-bold">
                        <span>⬅ मुख्य पृष्ठ</span>
                      </button>
                      <h2 className="text-xl sm:text-2xl font-black text-slate-900">शिकायत / सवाल दर्ज करें</h2>
                    </div>

                    <form onSubmit={handleComplaintSubmit} className="bg-white border-3 border-red-500 rounded-3xl p-6 shadow-md space-y-4">
                      <div>
                        <label className="text-xs font-black text-slate-700 block mb-1">समस्या की श्रेणी (Category):</label>
                        <div className="flex flex-wrap gap-1.5">
                          {COMPLAINT_CATEGORIES.map(cat => (
                            <button
                              key={cat}
                              type="button"
                              onClick={() => setCompCategory(cat)}
                              className={`px-3 py-1.5 rounded-xl text-xs font-bold border-2 transition-all ${
                                compCategory === cat ? 'bg-red-600 text-white border-red-700 shadow' : 'bg-slate-100 text-slate-700 border-slate-200'
                              }`}
                            >
                              {cat}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div>
                        <label className="text-xs font-black text-slate-700 block mb-1">फसल का चयन:</label>
                        <select
                          value={compCropName}
                          onChange={(e) => setCompCropName(e.target.value)}
                          className="w-full p-2.5 border-2 border-slate-300 rounded-xl text-xs font-bold"
                        >
                          {farmerCrops.map(c => (
                            <option key={c.id} value={c.name}>{c.name}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="text-xs font-black text-slate-700 block mb-1">संदेश / सवाल (लिखें या माइक से बोलें):</label>
                        <textarea
                          rows="3"
                          value={compText}
                          onChange={(e) => setCompText(e.target.value)}
                          placeholder="अपनी समस्या यहाँ लिखें..."
                          className="w-full p-3 border-2 border-slate-300 rounded-xl text-xs font-bold"
                        ></textarea>
                      </div>

                      <button
                        type="submit"
                        className="btn-tactile w-full bg-red-600 hover:bg-red-700 text-white font-black py-3.5 rounded-2xl text-base"
                      >
                        शिकायत / सवाल सबमिट करें ➔
                      </button>
                    </form>
                  </div>
                )}

                {/* -------------------------------------------------------- */}
                {/* 12. "शिकायत सूची" (COMPLAINTS & REPLIES VIEW)            */}
                {/* -------------------------------------------------------- */}
                {screen === 'complaints_list' && (
                  <div className="space-y-6 max-w-3xl mx-auto">
                    <div className="flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                      <button onClick={() => setScreen('home')} className="p-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-800 font-bold">
                        <span>⬅ मुख्य पृष्ठ</span>
                      </button>
                      <h2 className="text-2xl font-black text-slate-900">मेरी शिकायतें एवं समाधान</h2>
                      <button
                        onClick={() => setScreen('complaint_new')}
                        className="btn-tactile bg-red-600 text-white font-bold px-3 py-2 rounded-xl text-xs"
                      >
                        ➕ नई शिकायत
                      </button>
                    </div>

                    <div className="space-y-3">
                      {db.complaints.filter(c => c.farmerId === currentFarmer.id).map(comp => (
                        <div key={comp.id} className="p-4 bg-white rounded-3xl border-2 border-slate-200 space-y-2 shadow-sm">
                          <div className="flex justify-between items-center">
                            <span className="font-mono text-xs font-black bg-slate-100 px-2 py-0.5 rounded text-slate-800">
                              #{comp.id} • {comp.category}
                            </span>
                            <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${
                              comp.status.includes('Resolved') ? 'bg-green-100 text-green-900' : 'bg-amber-100 text-amber-900'
                            }`}>
                              {comp.status}
                            </span>
                          </div>
                          <p className="text-xs text-slate-800 font-bold">"{comp.message}"</p>

                          {comp.officerReply && (
                            <div className="p-3 bg-green-50 rounded-xl border border-green-200 text-xs">
                              <strong className="text-green-900 block">कार्यालय उत्तर (Reply):</strong>
                              <p className="text-green-800">{comp.officerReply}</p>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* -------------------------------------------------------- */}
                {/* 13. "सूचनाएँ" (DEDICATED NOTIFICATIONS SCREEN)            */}
                {/* -------------------------------------------------------- */}
                {screen === 'notifications' && (
                  <div className="space-y-6 max-w-3xl mx-auto">
                    <div className="flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                      <button onClick={() => setScreen('home')} className="p-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-800 font-bold">
                        <span>⬅ मुख्य पृष्ठ</span>
                      </button>
                      <h2 className="text-2xl font-black text-slate-900 flex items-center gap-2">
                        <span>🔔</span>
                        <span>सूचना केंद्र (Notifications)</span>
                      </h2>
                      {unreadNotifCount > 0 && (
                        <button
                          onClick={markAllNotifsRead}
                          className="text-xs font-bold text-kisan-700 underline"
                        >
                          सभी पढ़ें
                        </button>
                      )}
                    </div>

                    <div className="space-y-3">
                      {farmerNotifications.map(n => (
                        <div
                          key={n.id}
                          onClick={() => {
                            setDb(prev => ({
                              ...prev,
                              notifications: prev.notifications.map(item => item.id === n.id ? { ...item, isRead: true } : item)
                            }));
                            if (n.targetScreen) setScreen(n.targetScreen);
                          }}
                          className={`p-4 rounded-3xl border-2 transition-all cursor-pointer ${
                            n.isRead ? 'bg-white border-slate-200' : 'bg-amber-50 border-amber-300 shadow-sm'
                          }`}
                        >
                          <div className="flex items-start gap-3">
                            <span className="text-3xl">{n.icon}</span>
                            <div className="flex-1">
                              <div className="flex justify-between items-center">
                                <h4 className="font-black text-base text-slate-900">{n.title}</h4>
                                <span className="text-[11px] text-slate-400 font-bold">{n.time}</span>
                              </div>
                              <p className="text-xs text-slate-700 font-semibold mt-1">{n.message}</p>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* -------------------------------------------------------- */}
                {/* 14. "मेरी जानकारी" (FARMER PROFILE)                      */}
                {/* -------------------------------------------------------- */}
                {screen === 'profile' && (
                  <div className="space-y-6 max-w-3xl mx-auto">
                    <div className="flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                      <button onClick={() => setScreen('home')} className="p-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-800 font-bold">
                        <span>⬅ मुख्य पृष्ठ</span>
                      </button>
                      <h2 className="text-2xl font-black text-slate-900">मेरी जानकारी (Farmer Profile)</h2>
                    </div>

                    <div className="bg-white border-3 border-slate-800 rounded-3xl p-6 shadow-md space-y-4">
                      <div className="flex items-center gap-4 border-b pb-4">
                        <div className="w-16 h-16 bg-amber-100 rounded-2xl flex items-center justify-center text-4xl border border-amber-300">
                          👤
                        </div>
                        <div>
                          <span className="text-xs font-mono font-black text-blue-700 bg-blue-100 px-2 py-0.5 rounded">
                            {currentFarmer.id}
                          </span>
                          <h3 className="text-2xl font-black text-slate-900 mt-0.5">{currentFarmer.name}</h3>
                          <span className="text-xs text-slate-500 font-semibold">पंजीकरण: {currentFarmer.regDate}</span>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs sm:text-sm">
                        <div className="p-3 bg-slate-50 rounded-xl">📱 मोबाइल: <strong>{currentFarmer.mobile}</strong></div>
                        <div className="p-3 bg-slate-50 rounded-xl">🌾 कुल कृषि भूमि: <strong>{currentFarmer.totalLand} बीघा</strong></div>
                        <div className="p-3 bg-slate-50 rounded-xl col-span-2">📍 गाँव / क्षेत्र: <strong>{currentFarmer.village}</strong></div>
                        <div className="p-3 bg-slate-50 rounded-xl col-span-2">🏢 पसंदीदा केंद्र: <strong>{currentFarmer.preferredCentre}</strong></div>
                        <div className="p-3 bg-slate-50 rounded-xl col-span-2">
                          💳 DBT बैंक खाता: <strong>{currentFarmer.bankAccountMasked} (IFSC: {currentFarmer.ifsc})</strong>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* -------------------------------------------------------- */}
                {/* 15. "नया किसान पंजीकरण" (NEW FARMER REGISTRATION)        */}
                {/* -------------------------------------------------------- */}
                {screen === 'farmer_reg' && (
                  <div className="space-y-6 max-w-3xl mx-auto">
                    <div className="flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                      <button onClick={() => setScreen('home')} className="p-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-800 font-bold">
                        <span>⬅ वापस</span>
                      </button>
                      <h2 className="text-xl sm:text-2xl font-black text-slate-900">नया किसान पंजीकरण (Registration)</h2>
                    </div>

                    <form onSubmit={handleRegisterFarmer} className="bg-white border-3 border-emerald-600 rounded-3xl p-6 shadow-md space-y-4">
                      <div>
                        <label className="text-xs font-black text-slate-700 block mb-1">किसान का पूरा नाम:</label>
                        <input
                          type="text"
                          required
                          value={regName}
                          onChange={(e) => setRegName(e.target.value)}
                          placeholder="उदा. रमेश कुमार पटेल"
                          className="w-full p-3 border-2 border-slate-300 rounded-xl text-xs font-bold"
                        />
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="text-xs font-black text-slate-700 block mb-1">मोबाइल नंबर:</label>
                          <input
                            type="tel"
                            required
                            value={regMobile}
                            onChange={(e) => setRegMobile(e.target.value)}
                            placeholder="10 अंकों का मोबाइल"
                            className="w-full p-3 border-2 border-slate-300 rounded-xl text-xs font-bold"
                          />
                        </div>
                        <div>
                          <label className="text-xs font-black text-slate-700 block mb-1">कुल कृषि भूमि (बीघा):</label>
                          <input
                            type="number"
                            required
                            value={regLand}
                            onChange={(e) => setRegLand(e.target.value)}
                            className="w-full p-3 border-2 border-slate-300 rounded-xl text-xs font-bold"
                          />
                        </div>
                      </div>
                      <div>
                        <label className="text-xs font-black text-slate-700 block mb-1">गाँव / तहसील / जिला:</label>
                        <input
                          type="text"
                          value={regVillage}
                          onChange={(e) => setRegVillage(e.target.value)}
                          placeholder="उदा. ग्राम केसला, तहसील इटारसी"
                          className="w-full p-3 border-2 border-slate-300 rounded-xl text-xs font-bold"
                        />
                      </div>
                      <div>
                        <label className="text-xs font-black text-slate-700 block mb-1">प्राथमिक उपार्जन केंद्र:</label>
                        <select
                          value={regCentre}
                          onChange={(e) => setRegCentre(e.target.value)}
                          className="w-full p-3 border-2 border-slate-300 rounded-xl text-xs font-bold"
                        >
                          {PROCUREMENT_CENTRES.map(c => (
                            <option key={c.id} value={c.name}>{c.name}</option>
                          ))}
                        </select>
                      </div>

                      <button
                        type="submit"
                        className="btn-tactile w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl text-base"
                      >
                        पंजीकरण पूर्ण करें ➔
                      </button>
                    </form>
                  </div>
                )}

                {/* -------------------------------------------------------- */}
                {/* 16. "नई फसल जोड़ें" (ADD NEW CROP)                       */}
                {/* -------------------------------------------------------- */}
                {screen === 'new_crop' && (
                  <div className="space-y-6 max-w-3xl mx-auto">
                    <div className="flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                      <button onClick={() => setScreen('crops')} className="p-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-800 font-bold">
                        <span>⬅ वापस</span>
                      </button>
                      <h2 className="text-xl sm:text-2xl font-black text-slate-900">नई फसल पंजीकरण (Add Crop)</h2>
                    </div>

                    <form onSubmit={handleAddNewCrop} className="bg-white border-3 border-emerald-600 rounded-3xl p-6 shadow-md space-y-4">
                      <div>
                        <label className="text-xs font-black text-slate-700 block mb-1">फसल का नाम:</label>
                        <select
                          value={newCropName}
                          onChange={(e) => {
                            setNewCropName(e.target.value);
                            if (e.target.value.includes('सरसों')) setNewCropRate(5650);
                            else if (e.target.value.includes('चना')) setNewCropRate(5440);
                            else if (e.target.value.includes('गेहूँ')) setNewCropRate(2400);
                            else setNewCropRate(2300);
                          }}
                          className="w-full p-3 border-2 border-slate-300 rounded-xl text-xs font-bold"
                        >
                          <option value="सरसों (Mustard)">🌻 सरसों (Mustard) — MSP ₹5,650</option>
                          <option value="चना (Gram)">🫘 चना (Gram) — MSP ₹5,440</option>
                          <option value="गेहूँ (Wheat)">🌾 गेहूँ (Wheat) — MSP ₹2,400</option>
                          <option value="धान (Paddy)">🌱 धान (Paddy) — MSP ₹2,300</option>
                        </select>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="text-xs font-black text-slate-700 block mb-1">रकबा (Land Area):</label>
                          <input
                            type="text"
                            value={newCropLand}
                            onChange={(e) => setNewCropLand(e.target.value)}
                            className="w-full p-3 border-2 border-slate-300 rounded-xl text-xs font-bold"
                          />
                        </div>
                        <div>
                          <label className="text-xs font-black text-slate-700 block mb-1">अनुमानित मात्रा (Quintals):</label>
                          <input
                            type="text"
                            value={newCropEstQty}
                            onChange={(e) => setNewCropEstQty(e.target.value)}
                            className="w-full p-3 border-2 border-slate-300 rounded-xl text-xs font-bold"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="text-xs font-black text-slate-700 block mb-1">बुवाई तिथि:</label>
                        <input
                          type="text"
                          value={newCropSowing}
                          onChange={(e) => setNewCropSowing(e.target.value)}
                          className="w-full p-3 border-2 border-slate-300 rounded-xl text-xs font-bold"
                        />
                      </div>

                      <button
                        type="submit"
                        className="btn-tactile w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3.5 rounded-2xl text-base"
                      >
                        फसल पंजीकृत करें ➔
                      </button>
                    </form>
                  </div>
                )}

              </>
            )}

          </main>

          {/* ============================================================== */}
          {/* FOOTER                                                         */}
          {/* ============================================================== */}
          <footer className="bg-slate-900 text-slate-300 py-4 px-4 text-center text-xs border-t border-slate-800 mt-12">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <span>🌾</span>
                <span className="font-bold text-white">किसान सेतु (Kisan Setu) — SIH26032 डिजिटल उपार्जन मंच</span>
              </div>
              <div className="flex items-center gap-3 text-slate-400">
                <span>हेल्पलाइन: 1800-180-1551</span>
                <span>•</span>
                <button
                  onClick={() => {
                    if (roleMode === 'farmer') {
                      setScreen('admin_login');
                    } else {
                      setRoleMode('farmer');
                      setScreen('home');
                    }
                  }}
                  className="text-amber-400 hover:underline font-bold"
                >
                  {roleMode === 'farmer' ? '🛡️ अधिकारी कंसोल' : '🌾 किसान कंसोल'}
                </button>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<KisanSetuApp />);
  </script>
</body>
</html>
